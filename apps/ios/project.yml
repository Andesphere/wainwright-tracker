name: WainwrightsBaggers
options:
  bundleIdPrefix: com.wainwrightsbaggers
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB

settings:
  base:
    DEVELOPMENT_TEAM: 29388BLCGA
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "19"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    from: 11.31.0
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    from: 1.5.6
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift.git
    from: 0.8.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.91.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 9.29.2
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.84.1

targets:
  WainwrightsBaggers:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: WainwrightsBaggers
        excludes: [Info.plist, WainwrightsBaggers.entitlements]
    dependencies:
      - package: MapboxMaps
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: ConvexMobile
      - package: RevenueCat
      - package: Sentry
      - package: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wainwrightsbaggers.mobile
        PRODUCT_NAME: WainwrightsBaggers
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WainwrightsBaggers/Info.plist
        CODE_SIGN_ENTITLEMENTS: WainwrightsBaggers/WainwrightsBaggers.entitlements
    info:
      path: WainwrightsBaggers/Info.plist
      properties:
        CFBundleDisplayName: Wainwrights
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        ClerkPublishableKey: $(CLERK_PUBLISHABLE_KEY)
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        SentryDSN: $(SENTRY_DSN)
        PostHogProjectToken: $(POSTHOG_PROJECT_TOKEN)
        ConvexDeploymentURL: https://tame-avocet-977.eu-west-1.convex.cloud
        NSLocationWhenInUseUsageDescription: Shows where you are on the fells map so you can see which Wainwright is nearest.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarStyle: UIStatusBarStyleDefault

  WainwrightsBaggersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WainwrightsBaggersUITests
    dependencies:
      - target: WainwrightsBaggers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wainwrightsbaggers.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WainwrightsBaggers
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  WainwrightsBaggers:
    build:
      targets:
        WainwrightsBaggers: all
        WainwrightsBaggersUITests: [test]
    test:
      config: Debug
      targets:
        - WainwrightsBaggersUITests
    run:
      config: Debug
      # Local purchases in the Simulator and from Xcode. TestFlight and the App Store use the real products.
      storeKitConfiguration: Config/WainwrightsBaggers.storekit
    archive:
      config: Release
